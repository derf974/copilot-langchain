[project]
name = "langchain-copilot"
version = "0.3.0"
description = "LangChain integration for GitHub Copilot SDK"
readme = "README.md"
requires-python = ">=3.11.0"
authors = [
    { name = "derf974", email = "derf974@users.noreply.github.com" },
]
keywords = ["langchain", "copilot", "github", "llm", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "github-copilot-sdk==0.3.0",
    "langchain-core>=1.4.0",
    "pydantic>=2.13.4",
]

[project.urls]
Homepage = "https://github.com/derf974/copilot-langchain"
Repository = "https://github.com/derf974/copilot-langchain"
Issues = "https://github.com/derf974/copilot-langchain/issues"
Changelog = "https://github.com/derf974/copilot-langchain/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.3.0,<2",
    "black>=26.3.1",
    "ruff>=0.15.13",
    "langchain-tests>=1.1.7",
    "pytest-cov>=7.1.0",
    "langchain>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_copilot"]

[tool.hatch.version]
path = "src/langchain_copilot/__init__.py"
