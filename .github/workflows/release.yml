name: Release to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag to release (e.g. v1.2.3). If set, used instead of GITHUB_REF.'
        required: false
      publish:
        description: 'Whether to publish to PyPI (true/false)'
        required: false
        default: 'true'

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Verify version matches tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG_VERSION=${INPUT_TAG#v}
          else
            TAG_VERSION=${GITHUB_REF#refs/tags/v}
          fi

          PYPROJECT_VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)

          if [ -z "$TAG_VERSION" ]; then
            echo "⚠️ No tag detected. If running manually, provide the 'tag' input."
            echo "GITHUB_REF=$GITHUB_REF"
            exit 1
          fi

          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "❌ Version mismatch detected!"
            echo "   Tag version: $TAG_VERSION"
            echo "   pyproject.toml version: $PYPROJECT_VERSION"
            echo "Please update pyproject.toml version before creating the tag."
            exit 1
          fi

          echo "✅ Version match confirmed: $TAG_VERSION"

      - name: Build package
        run: uv build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/langchain-copilot
    permissions:
      id-token: write  # REQUIRED for PyPI Trusted Publishing
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password needed with Trusted Publishing
        # Configure at https://pypi.org/manage/account/publishing/
